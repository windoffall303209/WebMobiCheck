<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Logo MobiCheck -->
    <g id="icon-logo">
      <rect width="32" height="32" rx="10" fill="#C4F03A"/>
      <path fill="#12161B" d="M11,7 H19 A2,2 0 0,1 21,9 V21 A2,2 0 0,1 19,23 H11 A2,2 0 0,1 9,21 V9 A2,2 0 0,1 11,7 Z M11,9 V21 H19 V9 Z M14,20 H16 V21 H14 Z" />
      <circle cx="23" cy="23" r="6" fill="#12161B" />
      <path fill="#4A7A0C" d="M21,23 L22.5,24.5 L25.5,21.5 L26.5,22.5 L22.5,26.5 L20,24 Z" />
    </g>

    <!-- Chip CPU -->
    <g id="icon-chip">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="8" y="8" width="8" height="8" rx="1" fill="currentColor"/>
      <path d="M2 9h3 M2 15h3 M19 9h3 M19 15h3 M9 2v3 M15 2v3 M9 19v3 M15 19v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- RAM -->
    <g id="icon-ram">
      <rect x="3" y="6" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="6" y="9" width="3" height="6" fill="currentColor"/>
      <rect x="11" y="9" width="3" height="6" fill="currentColor"/>
      <rect x="16" y="9" width="2" height="6" fill="currentColor"/>
      <path d="M5 18v2 M9 18v2 M13 18v2 M17 18v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Storage -->
    <g id="icon-storage">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="1" fill="currentColor"/>
      <path d="M16 16l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Battery -->
    <g id="icon-battery">
      <rect x="3" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M20 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M10 9l-2 3h4l-2 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Display -->
    <g id="icon-display">
      <rect x="3" y="3" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8 21h8 M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Touch -->
    <g id="icon-touch">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    </g>

    <!-- Speaker -->
    <g id="icon-speaker">
      <path d="M4 14v-4h4l5-4v16l-5-4H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M17 9a5 5 0 0 1 0 6 M19 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Mic -->
    <g id="icon-mic">
      <rect x="8" y="3" width="8" height="11" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M5 10a7 7 0 0 0 14 0 M12 17v4 M8 21h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Camera -->
    <g id="icon-camera">
      <path d="M4 8h3l2-3h6l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="12" cy="14" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </g>

    <!-- Motion -->
    <g id="icon-motion">
      <rect x="7" y="3" width="10" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M2 12h2 M20 12h2 M3 7l2 1 M19 7l-2 1 M3 17l2-1 M19 17l-2-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Sensor -->
    <g id="icon-sensor">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.2 2.2 M16.9 16.9l2.2 2.2 M4.9 19.1l2.2-2.2 M16.9 7.1l2.2-2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Network -->
    <g id="icon-network">
      <path d="M2 17a14 14 0 0 1 20 0 M5 20a10 10 0 0 1 14 0 M9 23a5 5 0 0 1 6 0 M12 24.5a1 1 0 1 1 0-.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Vibration -->
    <g id="icon-vibrate">
      <rect x="8" y="4" width="8" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 8l-2 4 2 4 M20 8l2 4-2 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Checkmark -->
    <g id="icon-check">
      <path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Alert -->
    <g id="icon-alert">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 8v5 M12 16v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Chevron Right -->
    <g id="icon-chevron-right">
      <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Arrow Back -->
    <g id="icon-arrow-back">
      <path d="M19 12H5 M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Menu Hamburger -->
    <g id="icon-menu">
      <path d="M4 6h16 M4 12h16 M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Close -->
    <g id="icon-close">
      <path d="M6 6l12 12 M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Play -->
    <g id="icon-play">
      <polygon points="6,4 20,12 6,20" fill="currentColor"/>
    </g>

    <!-- Refresh -->
    <g id="icon-refresh">
      <path d="M20 12A8 8 0 1 1 18 6.5L20 4 M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Device Preview Mockup -->
    <g id="icon-device-mockup">
      <!-- Back body -->
      <rect x="2" y="8" width="34" height="64" rx="4" fill="#1E293B"/>
      <rect x="4" y="11" width="11" height="15" rx="2" fill="#0F172A"/>
      <circle cx="9.5" cy="15" r="2.5" fill="#38BDF8"/>
      <circle cx="9.5" cy="22" r="2.5" fill="#38BDF8"/>
      <!-- Front body with screen -->
      <rect x="28" y="4" width="34" height="68" rx="4" fill="#0F172A"/>
      <rect x="30" y="7" width="30" height="62" rx="2" fill="#4F9654"/>
      <circle cx="45" cy="9.5" r="1.5" fill="#0F172A"/>
      <!-- Home bar -->
      <rect x="40" y="65" width="10" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Phone Icon -->
    <g id="icon-phone">
      <rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="10" y1="18" x2="14" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="5" r="0.8" fill="currentColor"/>
    </g>

    <!-- Desktop / Monitor Icon -->
    <g id="icon-desktop">
      <rect x="3" y="3" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M8 20h8 M12 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>
</svg>
